openapi: 3.1.0
info:
  title: Brasil do Futuro — piloto de leitura
  version: 0.1.0
  description: Dados provisórios ou sintéticos. Não certifica baseline nem atualidade na origem.
servers:
  - url: http://localhost:18080
paths:
  /healthz:
    get:
      summary: Disponibilidade do PostgreSQL
      responses:
        '200': {description: Disponível}
        '503': {description: Banco indisponível}
  /v1/indicators:
    get:
      summary: Catálogo candidato e os 12 domínios
      parameters:
        - {$ref: '#/components/parameters/Mode'}
        - {$ref: '#/components/parameters/AsOf'}
      responses:
        '200': {$ref: '#/components/responses/Envelope'}
        '400': {description: Parâmetros inválidos}
  /v1/observations:
    get:
      summary: Observações conhecidas até as_of, uma versão por série e período
      parameters:
        - {$ref: '#/components/parameters/Mode'}
        - {$ref: '#/components/parameters/AsOf'}
      responses:
        '200': {$ref: '#/components/responses/Envelope'}
        '400': {description: Parâmetros inválidos}
        '503': {description: Consulta indisponível}
  /v1/indicators/{id}/observations:
    get:
      summary: Histórico da série por data de conhecimento
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/Mode'}
        - {$ref: '#/components/parameters/AsOf'}
      responses:
        '200': {$ref: '#/components/responses/Envelope'}
        '400': {description: Parâmetros inválidos}
        '503': {description: Consulta indisponível}
  /v1/scenarios:
    get:
      summary: Última execução por cenário conhecida até as_of
      parameters:
        - {$ref: '#/components/parameters/Mode'}
        - {$ref: '#/components/parameters/AsOf'}
      responses:
        '200': {$ref: '#/components/responses/Envelope'}
        '400': {description: Parâmetros inválidos}
        '503': {description: Consulta indisponível}
  /v1/alerts:
    get:
      summary: Alertas registrados até as_of, todos pendentes de revisão humana
      parameters:
        - {$ref: '#/components/parameters/Mode'}
        - {$ref: '#/components/parameters/AsOf'}
      responses:
        '200': {$ref: '#/components/responses/Envelope'}
        '400': {description: Parâmetros inválidos}
        '503': {description: Consulta indisponível}
  /v1/institutions:
    get:
      summary: Catálogo de atores e competências institucionais constitucionais
      parameters:
        - {$ref: '#/components/parameters/Mode'}
        - {$ref: '#/components/parameters/AsOf'}
      responses:
        '200': {$ref: '#/components/responses/Envelope'}
        '503': {description: Consulta indisponível}
  /v1/simulations/fiscal:
    post:
      summary: Enfileira simulação com premissas dinâmicas da identidade contábil da dívida
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_debt_pct, assumptions]
              properties:
                base_debt_pct: {type: string, example: "78.50"}
                assumptions:
                  type: object
                  required: [interest, growth, primary]
                  properties:
                    interest: {type: string, example: "0.105"}
                    growth: {type: string, example: "0.045"}
                    primary: {type: string, example: "0.010"}
                    adjustment: {type: string, example: "0.000"}
                    horizon_years: {type: integer, example: 4}
      responses:
        '202': {description: Simulação aceita e enfileirada para processamento assíncrono}
        '400': {description: Parâmetros inválidos ou violação de restrições de limites}
        '503': {description: Banco ou fila indisponível}
  /v1/simulations/fiscal/{id}:
    get:
      summary: Consulta o status e resultados de uma simulação fiscal dinâmica
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/Mode'}
        - {$ref: '#/components/parameters/AsOf'}
      responses:
        '200': {$ref: '#/components/responses/Envelope'}
        '404': {description: Simulação não encontrada}
        '503': {description: Consulta indisponível}
  /v1/health/sources:
    get:
      summary: Status de conformidade de calendário e freshness das fontes
      parameters:
        - {$ref: '#/components/parameters/Mode'}
        - {$ref: '#/components/parameters/AsOf'}
      responses:
        '200': {$ref: '#/components/responses/Envelope'}
        '503': {description: Consulta indisponível}
  /v1/admin/outbox/replay:
    post:
      summary: Disparo auditável de reprocessamento operacional de eventos da outbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, example: "Reprocessamento após correção do conector IBGE"}
                triggered_by: {type: string, example: "admin"}
                filter_indicator_id: {type: string, example: "br.ipca.monthly"}
                filter_event_type: {type: string, example: "EconomicIndicatorUpdated"}
      responses:
        '202': {description: Replay disparado e registrado em auditoria}
        '400': {description: Justificativa ausente ou payload inválido}
        '503': {description: Banco ou fila indisponível}
  /v1/admin/outbox/replay/{id}:
    get:
      summary: Consulta o status de um replay operacional
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/Envelope'}
        '404': {description: Replay não encontrado}
        '503': {description: Banco indisponível}
  /v1/proposals:
    get:
      summary: Carteira de propostas públicas avaliadas do Policy Lab
      parameters:
        - {name: axis, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Mode'}
        - {$ref: '#/components/parameters/AsOf'}
      responses:
        '200': {$ref: '#/components/responses/Envelope'}
        '503': {description: Consulta indisponível}
  /v1/proposals/{id}:
    get:
      summary: Detalhamento de proposta pública com mecanismo causal e referências
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/Mode'}
        - {$ref: '#/components/parameters/AsOf'}
      responses:
        '200': {$ref: '#/components/responses/Envelope'}
        '404': {description: Proposta não encontrada}
        '503': {description: Consulta indisponível}
  /v1/guidance/commitments:
    get:
      summary: Matriz de 4 quadrantes de compromissos do Guidance Brasil 2027-2030
      parameters:
        - {$ref: '#/components/parameters/Mode'}
        - {$ref: '#/components/parameters/AsOf'}
      responses:
        '200': {$ref: '#/components/responses/Envelope'}
        '503': {description: Consulta indisponível}
  /v1/scenarios/calibrations:
    get:
      summary: Parâmetros fiscais calibrados e elasticidades vinculadas aos cenários
      parameters:
        - {$ref: '#/components/parameters/Mode'}
        - {$ref: '#/components/parameters/AsOf'}
      responses:
        '200': {$ref: '#/components/responses/Envelope'}
        '503': {description: Consulta indisponível}
  /v1/admin/audit/decisions:
    get:
      summary: Consulta paginada da trilha imutável de auditoria de decisões
      security:
        - BearerAuth: []
        - RoleHeader: []
      parameters:
        - {name: entity_type, in: query, schema: {type: string}}
        - {name: actor_id, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200': {$ref: '#/components/responses/Envelope'}
        '401': {description: Não autenticado}
        '403': {description: Permissões insuficientes}
        '503': {description: Banco indisponível}
    post:
      summary: Homologação de nova decisão auditável com encadeamento de hash SHA-256
      security:
        - BearerAuth: []
        - RoleHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, entity_type, entity_id, justification, new_state]
              properties:
                event_id: {type: string}
                action: {type: string}
                entity_type: {type: string}
                entity_id: {type: string}
                justification: {type: string}
                previous_state: {type: object}
                new_state: {type: object}
      responses:
        '201': {description: Decisão registrada com sucesso}
        '400': {description: Dados da decisão inválidos}
        '401': {description: Não autenticado}
        '403': {description: Permissões insuficientes (mínimo reviewer)}
  /v1/backtests:
    get:
      summary: Métricas experimentais do último run conhecido no corte temporal
      description: >-
        Seleciona o último run do modo por as_of, created_at e ID (decrescentes),
        exigindo as_of e created_at menores ou iguais ao corte da consulta.
        Filtros se aplicam somente às métricas desse run, sem buscar em runs antigos.
        Sem run retorna run nulo e data vazio. Sem banco, inclusive fixture, retorna 503.
        latest significa última vintage capturada no corte, não verificação da origem oficial.
      parameters:
        - {$ref: '#/components/parameters/Mode'}
        - {$ref: '#/components/parameters/AsOf'}
        - {name: indicator_id, in: query, schema: {type: string}}
        - {name: horizon, in: query, schema: {type: integer, minimum: 0, maximum: 2147483647}}
        - {name: target, in: query, schema: {type: string, enum: [first_release, latest]}}
        - name: forecast_source
          in: query
          schema:
            type: string
            enum: [trajectory, scenario_run, benchmark_random_walk, benchmark_seasonal_naive]
      responses:
        '200':
          description: Run e métricas separados por fonte, alvo e tipo de origem; sem agregação adicional
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BacktestEnvelope'}
        '400': {description: Parâmetros inválidos}
        '503': {description: Banco ou consulta indisponível; nenhum fallback estático}
  /v1/observability/metrics:
    get:
      summary: Métricas consolidadas dos 4 planos de observabilidade e conformidade de SLOs
      description: >-
        models.backtesting contém experimental, mode, as_of, ex_ante_snapshots_count,
        last_run, backtested_indicators_count, backtested_indicator_ids e
        ex_ante_backtested_indicators_count. Somente esses novos campos são limitados
        por modo/as_of; os campos legados dos demais planos continuam globais.
        Contagem de snapshots ex-ante exclui benchmarks; cobertura usa só o run selecionado,
        incluindo grupos reconstruídos no total e separando a contagem ex-ante.
        Sem banco acessível, backtesting é nulo e backtesting_status é unavailable.
        Consulta de backtesting falha explicitamente com 503; sem run conhecido as
        contagens são zero e last_run é nulo. available não significa validação econômica.
      parameters:
        - {$ref: '#/components/parameters/Mode'}
        - {$ref: '#/components/parameters/AsOf'}
      responses:
        '200': {$ref: '#/components/responses/Envelope'}
        '503': {description: Consulta das métricas de backtesting indisponível}
components:
  schemas:
    BacktestRun:
      type: object
      required: [run_id, inputs_hash, code_version, as_of, min_sample, mode, created_at]
      properties:
        run_id: {type: string, format: uuid}
        inputs_hash: {type: string}
        code_version: {type: string}
        as_of: {type: string, format: date-time}
        min_sample: {type: integer, minimum: 1}
        mode: {type: string, enum: [source, fixture]}
        created_at: {type: string, format: date-time}
    BacktestMetric:
      type: object
      required: [run_id, indicator_id, horizon, forecast_source, target, origin_kind, unit,
                 n_obs, mae, rmse, bias, interval_coverage, relative_mae_vs_rw, insufficient_sample]
      properties:
        run_id: {type: string, format: uuid}
        indicator_id: {type: string}
        horizon: {type: integer, minimum: 0}
        forecast_source:
          type: string
          enum: [trajectory, scenario_run, benchmark_random_walk, benchmark_seasonal_naive]
        target: {type: string, enum: [first_release, latest]}
        origin_kind: {type: string, enum: [ex_ante, reconstructed]}
        unit: {type: string}
        n_obs: {type: integer, minimum: 1}
        mae: {type: number, minimum: 0}
        rmse: {type: number, minimum: 0}
        bias: {type: number, description: Forecast menos realizado}
        interval_coverage: {type: [number, 'null'], minimum: 0, maximum: 1}
        relative_mae_vs_rw: {type: [number, 'null'], minimum: 0}
        insufficient_sample: {type: boolean}
    BacktestEnvelope:
      type: object
      required: [meta, run, data, experimental]
      properties:
        meta:
          type: object
          description: Metadados padrão; as_of é o corte da consulta, distinto do as_of do run
        experimental: {const: true}
        run:
          oneOf:
            - {$ref: '#/components/schemas/BacktestRun'}
            - {type: 'null'}
        data:
          type: array
          items: {$ref: '#/components/schemas/BacktestMetric'}
  parameters:
    Mode:
      name: mode
      in: query
      schema: {type: string, enum: [source, fixture], default: source}
    AsOf:
      name: as_of
      in: query
      description: RFC3339 com timezone. Padrão é o momento da consulta.
      schema: {type: string, format: date-time}
    Limit:
      name: limit
      in: query
      description: Quantidade máxima de registros retornados (padrão 50, máx 200).
      schema: {type: integer, default: 50, maximum: 200}
    Offset:
      name: offset
      in: query
      description: Deslocamento inicial para paginação.
      schema: {type: integer, default: 0}
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RoleHeader:
      type: apiKey
      in: header
      name: X-Actor-Role
  responses:
    Envelope:
      description: Metadados temporais e dados; arrays podem estar vazios
      content:
        application/json:
          schema:
            type: object
            required: [meta, data]
            properties:
              meta:
                type: object
                required: [methodology_version, as_of, mode, freshness, baseline_status, publication_status]
                properties:
                  methodology_version: {type: string}
                  as_of: {type: string, format: date-time}
                  mode: {type: string, enum: [source, fixture]}
                  freshness: {const: not_verified_against_source}
                  baseline_status: {const: not_validated}
                  publication_status: {const: internal_pilot}
              data:
                oneOf:
                  - {type: array, items: {type: object}}
                  - {type: object}
