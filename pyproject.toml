[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brasil-do-futuro"
version = "0.1.0"
description = "Fundação auditável de inteligência econômica"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4", "requests>=2.32,<3", "opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
bdf = "bdf.cli:main"

[tool.setuptools.packages.find]
where = ["ingestion"]

[tool.pytest.ini_options]
pythonpath = ["ingestion"]
testpaths = ["tests"]
